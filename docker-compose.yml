services:
  mediasage:
    image: ghcr.io/ryanattanagra/mediasage:latest
    # To build locally instead, comment out 'image' and uncomment 'build':
    # build: .
    container_name: mediasage
    # Optional: Run as specific user for NAS/Synology (use your PUID:PGID)
    # user: "1000:1000"
    ports:
      - "5765:5765"
    environment:
      # All optional: you can configure everything in the setup wizard instead.
      # Values set in .env override Settings; anything left empty is ignored.

      # Media server selection: "plex" or "jellyfin" (auto-detected if only one URL is set)
      - MEDIA_SERVER=${MEDIA_SERVER:-}

      # Plex server settings
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - PLEX_MUSIC_LIBRARY=${PLEX_MUSIC_LIBRARY:-}
      # Optional: Plex URL as reached from browsers/phones, if different from PLEX_URL
      - PLEX_PUBLIC_URL=${PLEX_PUBLIC_URL:-}

      # Jellyfin server settings (API key: Jellyfin Dashboard > API Keys)
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_TOKEN=${JELLYFIN_TOKEN:-}
      - JELLYFIN_MUSIC_LIBRARY=${JELLYFIN_MUSIC_LIBRARY:-}

      # Performance tuning
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}

      # LLM Provider (anthropic, openai, gemini, ollama, or custom)
      # Defaults to gemini. Can also be configured in the web UI.
      #- LLM_PROVIDER=gemini

      # Cloud provider API keys (set one)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

      # Optional: Override default models
      #- LLM_MODEL_ANALYSIS=gemini-3.5-flash-lite
      #- LLM_MODEL_GENERATION=gemini-3.5-flash-lite

      # Local LLM: Ollama (experimental)
      #- LLM_PROVIDER=ollama
      #- OLLAMA_URL=http://host.docker.internal:11434
      #- OLLAMA_CONTEXT_WINDOW=32768

      # Local LLM: Custom OpenAI-compatible API (experimental)
      #- LLM_PROVIDER=custom
      #- CUSTOM_LLM_URL=https://openrouter.ai/api/v1
      #- CUSTOM_LLM_API_KEY=sk-or-your-key
      #- CUSTOM_CONTEXT_WINDOW=32768
    volumes:
      # Settings (config.user.yaml) and the library cache live here
      # Ensure directory is writable: either set 'user' above, or run:
      #   mkdir -p ./data && chmod 777 ./data
      - ./data:/app/data
    restart: unless-stopped
