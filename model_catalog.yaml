# Cloud models offered in Settings, grouped by provider.
#
# Costs are USD per million tokens. Prices updated Oct 2026.
# Mark superseded models `legacy: true` rather than removing them, so saved configs keep working.
# Provider defaults live in MODEL_DEFAULTS (backend/config.py).
#
# Optional fields:
#   long_context_threshold, long_input_cost, long_output_cost:
#     whole request is billed at the long rates above this many input tokens
#   effort: reasoning effort to request, for models that support it
#   legacy: still served, but superseded

